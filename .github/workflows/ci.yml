name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_URL: http://127.0.0.1:3107
      DEMO_ENABLED: "true"
      STORAGE_MODE: local
      MEDIA_ROOT: ${{ github.workspace }}/.data
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint && npm test
      - run: npm run build && npm run typecheck
      - name: Run actual application and worker smoke checks
        run: |
          mkdir -p output
          npm run smoke > output/smoke.log 2>&1
      - name: Validate container runtime and backup restore
        run: npm run smoke:container > output/container-smoke.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-checks
          path: output/
