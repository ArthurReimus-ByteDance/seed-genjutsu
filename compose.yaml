name: recast-studio
x-app: &app
  image: recast-studio:local
  build: .
  env_file: .env.local
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://recast:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}@db:5432/recast
    MEDIA_ROOT: /app/.data
  volumes:
    - media:/app/.data
  init: true
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: recast
      POSTGRES_DB: recast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    volumes:
      - database:/var/lib/postgresql
    ports:
      - "127.0.0.1:58432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recast -d recast"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["./node_modules/.bin/tsx", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    <<: *app
    ports:
      - "127.0.0.1:3107:3107"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3107/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *app
    command: ["./node_modules/.bin/tsx", "scripts/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  database:
  media:
