name: recast-studio
x-app: &app
  image: recast-studio:local
  build: .
  env_file: .env.local
  environment:
    NODE_ENV: production
    MEDIA_ROOT: /app/.data
  volumes:
    - media:/app/.data
  init: true
services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:3107:3107"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3107/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *app
    command: ["./node_modules/.bin/tsx", "scripts/worker.ts"]
    restart: unless-stopped
volumes:
  media:
